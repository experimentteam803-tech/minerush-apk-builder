name: Build MineRush AdMob APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK Environment & Licenses
      run: |
        mkdir -p "$ANDROID_HOME/licenses"
        echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
        echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

    - name: Install Gradle 8.5
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
        unzip -q gradle-8.5-bin.zip
        echo "$GITHUB_WORKSPACE/gradle-8.5/bin" >> $GITHUB_PATH

    - name: Build Android APK
      run: |
        gradle assembleDebug --no-daemon --warning-mode all 2>&1 | tee build_output.log
      continue-on-error: false

    - name: Capture Error If Failed
      if: failure()
      run: |
        echo "### ⚠️ Build Failed Details:" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        grep -A 10 -B 2 "What went wrong" build_output.log || tail -n 25 build_output.log >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

    - name: Upload Compiled APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: MineRush-Official-AdMob-APK
        path: app/build/outputs/apk/debug/app-debug.apk
