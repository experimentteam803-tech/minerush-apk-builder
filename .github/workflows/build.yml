name: Build MineRush AdMob APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Gradle 8.5 Directly
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
        unzip -q gradle-8.5-bin.zip
        echo "$GITHUB_WORKSPACE/gradle-8.5/bin" >> $GITHUB_PATH

    - name: Accept Android Licenses & Build APK
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        gradle assembleDebug --no-daemon --stacktrace

    - name: Upload Compiled APK
      uses: actions/upload-artifact@v4
      with:
        name: MineRush-Official-AdMob-APK
        path: app/build/outputs/apk/debug/app-debug.apk
