plugins {
    id 'com.android.application'
}

android {
    namespace 'com.payzo.minerush'
    compileSdk 34

    defaultConfig {
        applicationId "com.payzo.minerush"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.0.2"
    }

    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword 'minerush@2026'
            keyAlias 'minerushkey'
            keyPassword 'minerush@2026'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Start.io Official SDK (Real Ads without store requirement)
    implementation 'com.startapp:inapp-sdk:5.0.2'
}
